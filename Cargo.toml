[package]
name = "exchange-clock-offset"
version = "0.1.0"
edition = "2021"
description = "Measure clock offset between the local machine and major crypto exchange servers (spot & USDⓈ-M futures)."

[dependencies]
anyhow = "1.0"
tokio = { version = "1.39", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
opt-level = 3
